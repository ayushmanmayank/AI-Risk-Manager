server {
    # 8080, not 80 -- this runs under nginxinc/nginx-unprivileged (see
    # frontend/Dockerfile), specifically so the container process never
    # needs root/CAP_NET_BIND_SERVICE just to bind its own port. The
    # host-facing port (docker-compose.yml's FRONTEND_PORT, default 3000)
    # is unaffected -- Docker's port mapping still publishes it exactly
    # where it always has.
    listen 8080;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    # Scoped to this app's actual resource origins: Google Fonts
    # (stylesheet + font files, see index.html) and the API.
    #
    # TWO REAL BUGS FOUND LIVE (curl doesn't enforce CSP, so the earlier
    # pass's `docker compose`/curl verification never caught either --
    # only an actual browser does, confirmed via a headless-Chrome console
    # check after the app reported "couldn't reach API"):
    #
    # 1. connect-src was `'self' https:` -- HTTPS-only, on the theory that
    #    hardcoding a local origin would do nothing useful and a real
    #    deployment would be HTTPS anyway. Wrong: this app's actual local/
    #    dev deployment talks to a PLAIN-HTTP backend
    #    (VITE_API_BASE_URL=http://localhost:8000/api/v1, see
    #    docker-compose.yml), and CSP enforces regardless of "local or
    #    not" -- every fetch() call was silently blocked. Fixed by adding
    #    explicit http://localhost:*/127.0.0.1:* alongside https: (a port
    #    wildcard, so a customized BACKEND_PORT still works) -- scoped to
    #    local addresses specifically, not a blanket allow-any-HTTP-site.
    # 2. script-src was `'self'` with no allowance for index.html's small
    #    inline theme-flash-prevention script, which a strict CSP blocks
    #    by default. Fixed with that exact script's own sha256 hash
    #    (narrower and safer than 'unsafe-inline', which would allow ANY
    #    inline script to run) -- if that inline script's content ever
    #    changes, this hash must be recomputed to match or it breaks again
    #    the same way.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-0I1Gi001NPwWq1QQHDPts0AFniO/TMTr6ArOblhQ3ls='; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; frame-ancestors 'none'; base-uri 'self'" always;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any path not matching a real static file (e.g.
    # /transactions/txn_123, /chargebacks/cb_456 on a hard refresh) is
    # served index.html so React Router's client-side routing can take
    # over, instead of nginx returning a 404 for a route that only
    # exists in JS.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

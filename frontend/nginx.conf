server {
    # 8080, not 80 -- this runs under nginxinc/nginx-unprivileged (see
    # frontend/Dockerfile), specifically so the container process never
    # needs root/CAP_NET_BIND_SERVICE just to bind its own port. The
    # host-facing port (docker-compose.yml's FRONTEND_PORT, default 3000)
    # is unaffected -- Docker's port mapping still publishes it exactly
    # where it always has.
    listen 8080;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    # Scoped to this app's actual resource origins: Google Fonts
    # (stylesheet + font files, see index.html) and the API. connect-src
    # allows any HTTPS origin rather than one specific backend host --
    # the production backend's exact origin isn't fixed yet (pending a
    # hosting decision), and hardcoding today's local dev origin here
    # would either do nothing (browsers don't enforce CSP against a
    # same-origin dev proxy) or silently break the real deployment later.
    # Once the backend's production origin is fixed, tighten this to that
    # exact origin instead of the 'https:' wildcard.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'" always;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any path not matching a real static file (e.g.
    # /transactions/txn_123, /chargebacks/cb_456 on a hard refresh) is
    # served index.html so React Router's client-side routing can take
    # over, instead of nginx returning a 404 for a route that only
    # exists in JS.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

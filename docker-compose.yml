services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Persists the SQLite predictions DB across restarts (task
      # requirement) and supplies data/processed/features.csv, which is
      # too large and too licensed-adjacent to bake into the image -- see
      # README.md's "Dataset setup" for how to produce it before first run.
      - ./data:/app/data
    environment:
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked in at build time (Vite env vars are compile-time). Must
        # be reachable from your BROWSER -- localhost + backend's
        # published port -- never the Docker-internal hostname `backend`.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
